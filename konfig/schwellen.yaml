# Alle Schwellen an einer Stelle. VORLÄUFIG: noch nicht kalibriert.
# Später schlägt der Nachprüfer Änderungen vor, entschieden wird von Hand.

enso:
  el_nino_ab: 0.5          # ONI ab +0,5 gilt als El Niño
  mindest_jahreszeiten: 5   # so viele Jahreszeiten in Folge machen eine Episode (NOAA)
  la_nina_bis: -0.5
  staerke_voll_bei: 2.0    # ONI +2,0 entspricht Stärke 1,0
  hoehepunkt_bestaetigt_nach: 2   # so viele Jahreszeiten unter dem Maximum

dipol:
  positiv_ab: 0.4          # Dipol-Index ab +0,4 °C gilt als positiv (Stufe 3)
  wind_anomalie_ms: -1.0   # Stufe 2: Ostwinde mindestens 1 m/s stärker als normal (Mai/Juni)
  wind_monate: [5, 6]
  wind_mindest_tage: 14     # vorher kein Urteil über die Ostwinde

zeugen:
  ost:
    tage: 90               # Regen der letzten 90 Tage
    trocken_bis_anteil: 0.75   # höchstens 75 % des Normalen gilt als trocken
  west:
    monate: [10, 11, 12]   # kurze Regenzeit Ostafrika; außerhalb schweigt der Zeuge
    nass_ab_anteil: 1.25   # mindestens 125 % des Normalen gilt als nass
    mindest_tage: 21       # vorher ist die Saison zu jung für ein Urteil

agrar_ampel:
  zeitfenster_knapp_ab: 0.5        # Zeitfenster höchstens 0,5 gilt als knapp
  gegenkraefte_ueberwiegen_ab: 0.6
  markt_schlaeft_bis_z: 1.0        # Z-Wert unter 1,0: der Markt schläft noch
  z_voll_bei: 3.0                  # Z-Wert 3 entspricht voller Abzug im Score
  gegen_voll_bei: 0.20             # 20 % Preisrückgang in drei Monaten entspricht voller Gegenkraft
  gewichte: {staerke: 0.25, zeitfenster: 0.25, zwert: 0.25, gegenkraefte: 0.25}
  # Beschluss 26.09.2026: Die Farbe sagt, wann es so weit ist (Checkliste und Zeitfenster),
  # die Zahl dahinter nur, wie gut der Kandidat ist (Stärke, Preisprobe, Gegenkräfte).
  # false wäre der Score wie im Konzept, mit dem Zeitfenster in der Zahl.
  zahl_ohne_zeitfenster: true

kurse:
  z_fenster_tage: 200
  historie: 2y             # so viel Kurshistorie holt der erste Lauf (yfinance kennt 1y, 2y, 5y, 10y, max)

inlandspreise:              # Frühzeichen, nicht am Rückblick geprüft (die Reihen beginnen erst 2017)
  mittel_tage: 28            # Mittel der letzten vier Wochen …
  abstand_tage: 84           # … gegen dasselbe Mittel zwölf Wochen früher
  mindest_werte: 8           # so viele Tageswerte je Fenster, sonst kein Urteil
  anstieg_ab: 0.10           # ab plus 10 Prozent: Frühzeichen
  stark_ab: 0.20             # ab plus 20 Prozent: starkes Frühzeichen
  veraltet_nach_tage: 21     # älterer letzter Wert: kein Urteil
  veraltet_nach_tage_monat: 100   # Monatsreihen (FAO) erscheinen mit etwa zwei Monaten Verzug
  pihps_ab: 2018-01-01       # so weit zurück wird die Geschichte nachgeholt
  pihps_erst_tage: 150       # erster Lauf: so viele Tage zuerst, die Geschichte folgt rückwärts in Stücken

nachpruefer:
  mindest_signale_fuer_vorschlag: 5   # erst ab so vielen abgeschlossenen echten Signalen schlägt er vor, die Regeln zu prüfen
  betrieb_seit: 2026-09-27            # erster geplanter Tageslauf; Tage davor zählen in der Laufkontrolle nicht als Ausfall

rueckblick:
  beginn: 1960-01
  lernzeit_bis: 2015-12    # danach Prüfzeit: bleibt weggeschlossen, bis sie einmal bewusst geöffnet wird
  wetter_unsicher_bis: 1978   # ERA5 vor der Satellitenzeit in den Tropen unsicherer, wird getrennt ausgewiesen
  # Bestehensgrenze beschlossen am 26.09.2026 (vor dem ersten Lauf); nicht nachträglich lockern:
  treffer_ab: 0.20         # Rot ist ein Treffer, wenn der Preis in den 12 Monaten danach um mindestens 20 % steigt
  bewegung_ab: 0.30        # große Bewegung: Anstieg um mindestens 30 % innerhalb von 12 Monaten
  erkannt_monate_vorher: 6 # Gelb höchstens so viele Monate vor Beginn einer großen Bewegung zählt als Vorwarnung;
                           # „rechtzeitig“ heißt: eine gedachte Position (Rot) ist zu Beginn schon offen
  bestehen:
    mehrwert_ab: 0.10      # 12-Monats-Änderung nach Rot mindestens 10 Prozentpunkte über dem Mittel aller Monate
    mindest_signale: 3
    treffer_mindestens_wie_fehlalarme: true
    zufall_hoechstens: 0.10   # höchstens 10 % gleich großer Zufallsziehungen von Monaten dürfen genauso gut sein
  verzug:                  # was am 15. eines Monats schon veröffentlicht war
    oni_monate: 2          # Jahreszeit mit Mitte im Monat m (JAS: August) gilt ab Monat m + 2
    dmi_monate: 1
    preis_monate: 2        # wie FRED im täglichen Lauf
    gegen_monate: 1        # Monatsdurchschnitt statt Tageskurs
    regen_tage: 6
    wind_ab_monat: 7       # Mai und Juni gehen erst ab Juli als ganzes Jahr ein
  varianten:               # wenige, vorher festgelegte Vergleiche; kein freies Optimieren
    - {name: "Zeitfenster neun Monate", vorlauf_T_monate: 9}
    - {name: "Zeitfenster fünfzehn Monate", vorlauf_T_monate: 15}
