# Alle Datenquellen. Topf 1 = maschinenlesbar. Der Prüflauf schreibt den Zustand
# jeder Quelle nach daten/quellen-status.json.

oni:
  name: "NOAA CPC · El-Niño-Index (ONI)"
  url: "https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt"
  topf: 1
  takt: monatlich

dmi:
  name: "Dipol-Index (DMI)"
  urls:                    # Reihenfolge beim ersten Mal; danach wird die zuletzt benutzte zuerst gefragt
    - {name: "JMA, Basis 1991–2020", url: "https://ds.data.jma.go.jp/tcc/tcc/products/elnino/index/sstindex/base_period_9120/DMI/anomaly"}
    - {name: "NOAA PSL (HadISST)", url: "https://psl.noaa.gov/data/timeseries/month/data/dmi.had.long.data"}
    - {name: "NOAA PSL GCOS (HadISST)", url: "https://psl.noaa.gov/gcos_wgsp/Timeseries/Data/dmi.had.long.data"}
  topf: 1
  takt: monatlich

openmeteo:
  name: "Open-Meteo · ERA5-Reanalyse (Regen, Wind)"
  url: "https://archive-api.open-meteo.com/v1/archive"
  modell: era5             # fest gewählt, damit Normalwerte und heutige Werte aus demselben Modell stammen
  topf: 1
  takt: täglich
  gewicht_pro_minute: 75   # gedrosselt: Open-Meteo erlaubt 600/Minute, 5000/Stunde, 10000/Tag

fred:
  name: "FRED · Rohstoffpreise monatlich (IMF)"
  url: "https://fred.stlouisfed.org/graph/fredgraph.csv"
  topf: 1
  takt: monatlich

yahoo:
  name: "Yahoo Finance über yfinance (Kurse, Volumen)"
  topf: 1
  takt: täglich
  gegenkraefte:
    brent: "BZ=F"
    sojaoel: "ZL=F"

# Geschichtsdaten für den Rückblick (einmalig geholt mit `python -m anlage.geschichte`).
geschichte:
  weltbank:
    name: "Weltbank Pink Sheet, Monatspreise ab 1960"
    urls:                  # erste lesbare gewinnt; die Seite dient als Rückfall, falls die Datei umzieht
      - "https://thedocs.worldbank.org/en/doc/18675f1d1639c7a34d463f59263ba0a2-0050012025/related/CMO-Historical-Data-Monthly.xlsx"
    seite: "https://www.worldbank.org/en/research/commodity-markets"
  preise:                  # Kennung → Spalte im Pink Sheet, Rückfall FRED (erst ab 1992)
    palmoel: {weltbank: "Palm oil", fred: PPOILUSDM}
    brent: {weltbank: "Crude oil, Brent", fred: POILBREUSDM}
    sojaoel: {weltbank: "Soybean oil", fred: PSOILUSDM}
  ernte:
    name: "USDA PSD, Ölsaaten (Produktion Palmöl je Land)"
    url: "https://apps.fas.usda.gov/psdonline/downloads/psd_oilseeds_csv.zip"
    ware: "Oil, Palm"
    laender: [Indonesia, Malaysia]
  regen_ab: 1959-10-01     # 90 Tage Vorlauf vor dem ersten Rückblick-Monat
  wind_ab: 1960

# Metall-Agent (China-Pilot). Die Meldungen selbst liest der Metall-Wächter aus Gmail;
# hier stehen nur die maschinenlesbaren Kanäle.
bundesregister:
  name: "US-Bundesregister (Federal Register), Suche"
  url: "https://www.federalregister.gov/api/v1/documents.json"
  topf: 1
  takt: täglich
usgs_beben:
  name: "USGS · Erdbeben"
  url: "https://earthquake.usgs.gov/fdsnws/event/1/query"
  topf: 1
  takt: täglich
openmeteo_vorhersage:
  name: "Open-Meteo · Regen der letzten Tage und Vorhersage"
  url: "https://api.open-meteo.com/v1/forecast"
  topf: 1
  takt: täglich
