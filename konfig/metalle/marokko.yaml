# Metall-Agent · Marokko (Phosphat). Beschluss aus der Sprachnotiz vom 08.10.2026.
# Meldungen liest der Marokko-Wächter in der Cloud aus dem Gmail-Label „Marokko-Meldungen“.
#
# BESONDERHEIT: Das Signal ist hier NICHT der plötzliche Stopp, sondern PREISSETZUNGSMACHT.
# Der Staatskonzern OCP beherrscht einen großen Teil des Welthandels mit Phosphatdünger und
# Marokko sitzt auf dem größten Teil der Weltreserven. Lesbare Ereignisse sind Exportverträge
# mit Großabnehmern, Düngemittelpolitik und Zollentscheidungen der Abnehmerländer.
#
# EINORDNUNG: Das ist ein SENSOR-Fall plus Substitutions-Fall, kein sauberer Kauf-Fall —
# vergleichbar mit Orangensaft und Haselnuss. OCP ist staatlich und nicht börsennotiert,
# einen reinen Phosphat-ETC gibt es nach jetzigem Kenntnisstand nicht. Der Umweg führt über
# Düngemittelkonzerne, die auch Kali und Stickstoff machen — ein unsauberer Hebel.
#
# SUBSTITUTION: Phosphatdünger konkurriert mit Kali und Stickstoff. Als Russland und Belarus
# bei Kali unter Sanktionen fielen, zog die Nachfrage nach marokkanischem Phosphat an. Das ist
# der eigentliche Hebel — und der Grund, warum Nutrien und Mosaic überhaupt mitlaufen.

kennung: marokko
name: "Marokko-Phosphat"
familie: B
treiber: politik
rolle: sensor
laenderpaar: "Marokko ↔ EU und USA über Westsahara, Cadmium und Ausgleichszölle"

metalle:
  phosphat: {name: Phosphat, konzentration: 0.70, unersetzlichkeit: 1.00, achse: duenger}

achsen:
  duenger:
    name: "Dünger-Achse"
    beschreibung: "Phosphatgestein und Phosphatdünger; unersetzlicher Pflanzennährstoff"
    metalle: [phosphat]
    pilot: true

# Kein reiner Phosphat-Wert an der Börse. Beide Werte sind ausdrücklich SENSOR:
# sie hängen auch an Kali und Stickstoff und verwässern das Signal.
# Offener Prüfpunkt: Gibt es einen Kali- oder breiten Dünger-ETC als saubereren Zugang?
instrumente:
  - {ticker: NTR, name: "Nutrien",  achse: duenger, rolle: sensor, waehrung: USD, hinweis: "Kanada; größter Düngemittelkonzern, aber schwerpunktmäßig Kali — verwässert"}
  - {ticker: MOS, name: "Mosaic",   achse: duenger, rolle: sensor, waehrung: USD, hinweis: "USA; Phosphat und Kali, zugleich Kläger in den Ausgleichszollverfahren gegen OCP"}
vergleich: {ticker: AIGI.L, name: "Industriemetall-Korb (WisdomTree Industrial Metals, Vergleichsmaßstab)"}

standorte:
  - {kennung: khouribga,   name: "Khouribga",                 lat: 32.88, lon:  -6.91, metalle: [phosphat], art: "größtes Phosphat-Bergbaugebiet der Welt (Ouled Abdoun)"}
  - {kennung: benguerir,   name: "Benguerir",                 lat: 32.24, lon:  -7.95, metalle: [phosphat], art: "Mine im Gantour-Becken, versorgt Safi"}
  - {kennung: jorf_lasfar, name: "Jorf Lasfar",               lat: 33.11, lon:  -8.62, metalle: [phosphat], art: "weltgrößter Düngemittelkomplex und Exporthafen"}
  - {kennung: safi,        name: "Safi",                      lat: 32.30, lon:  -9.24, metalle: [phosphat], art: "älterer Verarbeitungs- und Exportstandort"}
  - {kennung: bou_craa,    name: "Bou Craa (Westsahara)",     lat: 26.32, lon: -12.85, metalle: [phosphat], art: "Phosboucraa, 100 km Förderband zum Hafen"}
  - {kennung: laayoune,    name: "Laayoune / El Marsa",       lat: 27.15, lon: -13.20, metalle: [phosphat], art: "Verladehafen für Bou-Craa-Phosphat, politisch sensibelster Punkt"}

stoerung:
  erdbeben:
    - {ab: 5.0, km: 80}
    - {ab: 6.0, km: 200}
    - {ab: 7.0, km: 400}
  starkregen_ab_mm: 50        # Sturzfluten im Tagebau; in Marokko ist das bereits viel
  trocken_fenster_tage: 180   # Dürre schlägt auf den Wasserbedarf der Aufbereitung durch
  trocken_unter: 0.6
  trocken_normal_ab_mm: 20
  gelb_tage: 30

fristen_gelb_ab_tage: 30
fristen:
  - kennung: cadmium_eu
    name: "EU-Cadmiumgrenzwert von 60 mg/kg für Phosphatdünger (Verordnung 2019/1009)"
    nummer: 1009
    achsen: [duenger]
    bis: 2027-12-31
    stand: "In Kraft; eine Absenkung des Grenzwerts würde marokkanisches Gestein stärker treffen als russisches. Überprüfung steht an."
    verlaengert_bis: null
  - kennung: us_ausgleichszoll
    name: "US-Ausgleichszoll auf marokkanischen Phosphatdünger"
    nummer: null
    achsen: [duenger]
    bis: 2027-12-31
    stand: "Seit 26.12.2024 bei 16,60 Prozent. Jede jährliche Überprüfung kann den Satz bewegen."
    verlaengert_bis: null
  - kennung: eu_agrarabkommen
    name: "Geändertes EU-Marokko-Agrarabkommen mit Herkunftskennzeichnung für die Südprovinzen"
    nummer: null
    achsen: [duenger]
    bis: 2027-10-03
    stand: "Seit 03.10.2025 vorläufig angewandt; betrifft Phosphat nur mittelbar, ist aber der Gradmesser für die Westsahara-Frage."
    verlaengert_bis: null

gegenseite:
  tage: 30
  begriffe:
    phosphate: [duenger]
    fertilizer: [duenger]
    "phosphoric acid": [duenger]
    "critical mineral": []
  behoerden_suche: [industry-and-security-bureau, trade-representative-office-of-united-states, commerce-department,
                    international-trade-administration, executive-office-of-the-president]
  gewichtig:
    - {art: "Presidential Document"}
    - {behoerde: "trade-representative-office-of-united-states"}
    - {behoerde: "commerce-department", arten: ["Rule", "Proposed Rule"]}
    - {behoerde: "international-trade-administration", titel_enthaelt: ["Morocco"], titel_nennt_achse: true}
  ausschluss_titel: ["Advisory Committee", "Meeting"]
  suchwoerter:
    duenger: [phosphate, fertilizer, "phosphoric acid", DAP, MAP]

preisprobe:
  tage_kurz: 5
  tage_lang: 20
  gelaufen_ab: 0.15
  handel_tage: 60
  duenn_unter: 1000000

# Ereignisse für den Rückblick (Tag der Ankündigung). Recherchiert am 08.10.2026.
# Hinweis aus der Recherche: OCP veröffentlicht Preisentscheidungen NICHT mit Pressedatum.
# Preisbewegungen sind nur über Marktberichte abgreifbar, nicht als datierbares Politikereignis.
# Deshalb bestehen die Ereignisse hier aus Verträgen, Zöllen und Regelwerken.
ereignisse:
