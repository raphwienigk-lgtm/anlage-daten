  - {datum: 2025-10-03, art: lockerung,     achsen: [duenger], text: "Marokko und EU unterzeichnen den Briefwechsel mit Herkunftskennzeichnung der Südprovinzen"}
  - {datum: 2026-03-12, art: lockerung,     achsen: [duenger], text: "Indien sichert sich 2,5 Millionen Tonnen Dünger von OCP"}
  - {datum: 2026-09-18, art: lockerung,     achsen: [duenger], text: "OCP Nutricrops und Brasilien zeichnen eine Absichtserklärung über 3,8 Millionen Tonnen"}

rueckblick:
  horizonte: [0, 5, 20, 60]
  vorlauf: 20
  haupt: 20
  treffer_ab: 0.10
  bestanden: {mindestens: 3, trefferquote: 0.5}
  kurse_ab: 2008-01-01
