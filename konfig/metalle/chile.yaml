# Metall-Agent · Chile (Lithium). Beschluss aus der Sprachnotiz vom 08.10.2026.
# Meldungen liest der Chile-Wächter in der Cloud aus dem Gmail-Label „Chile-Meldungen“.
#
# BESONDERHEIT gegenüber Indonesien: Chile verknappt selten durch einen Exportstopp (Schock),
# sondern durch AUSBLEIBENDE EXPANSION — blockierte, verzögerte oder verstaatlichte Projekte
# lassen das erwartete Angebot nicht wachsen. Das ist eine Nicht-Handlung ohne klares
# Startdatum und deshalb maschinell schwer zu fassen. Behelf: Jede staatliche Entscheidung
# über eine Konzession (CEOL), eine Quote oder ein Salar-Projekt ist ein datierbares Ereignis
# und wird als solches geführt; das Ausbleiben selbst wird NICHT geraten.
#
# ZWIESPALT: Eine Verstaatlichung hebt den Weltpreis und drückt zugleich den Kurs der
# chilenischen Förderer. SQM und Albemarle sind hier SENSOR, nicht Kauf.

kennung: chile
name: "Chile-Lithium"
familie: B
treiber: politik
rolle: sensor
laenderpaar: "Chile ↔ Weltmarkt über die staatliche Lithium-Strategie"

metalle:
  lithium: {name: Lithium, konzentration: 0.25, unersetzlichkeit: 0.70, achse: lithium}

achsen:
  lithium:
    name: "Lithium-Achse"
    beschreibung: "Salar-Sole aus der Atacama; Batteriezellen als Nachfrageseite"
    metalle: [lithium]
    pilot: true

# Kein geprüfter Einzel-ETC auf Lithium — offener Punkt, im Prüflauf nachzutragen.
# Bis dahin: ein Produzent AUSSERHALB Chiles als Kandidat, die chilenischen Förderer
# ausdrücklich nur als Sensor.
instrumente:
  - {ticker: PLS.AX, name: "Pilbara Minerals",  achse: lithium, rolle: beobachtung, waehrung: AUD, hinweis: "Spodumen in Australien, profitiert von chilenischer Verknappung"}
  - {ticker: SQM,    name: "SQM",               achse: lithium, rolle: sensor,      waehrung: USD, hinweis: "fördert im Salar de Atacama — leidet unter Verstaatlichung, kein Kauf"}
  - {ticker: ALB,    name: "Albemarle",         achse: lithium, rolle: sensor,      waehrung: USD, hinweis: "fördert im Salar de Atacama — gleicher Zwiespalt wie SQM"}
vergleich: {ticker: AIGI.L, name: "Industriemetall-Korb (WisdomTree Industrial Metals, Vergleichsmaßstab)"}

standorte:
  - {kennung: atacama,     name: "Salar de Atacama",            lat: -23.50, lon: -68.25, metalle: [lithium], art: "Kernstandort, SQM und Albemarle, jetzt Nova Andino Litio"}
  - {kennung: maricunga,   name: "Salar de Maricunga",          lat: -26.99, lon: -69.13, metalle: [lithium], art: "Codelco-Konzession mit Rio Tinto"}
  - {kennung: altoandinos, name: "Salares Altoandinos",         lat: -26.17, lon: -69.07, metalle: [lithium], art: "ENAMI-Projekt mit Rio Tinto"}
  - {kennung: la_negra,    name: "La Negra, Antofagasta",       lat: -23.75, lon: -70.30, metalle: [lithium], art: "Verarbeitungsanlage Albemarle"}
  - {kennung: carmen,      name: "Salar del Carmen, Antofagasta", lat: -23.57, lon: -70.33, metalle: [lithium], art: "Verarbeitungsanlage SQM"}

stoerung:
  erdbeben:
    - {ab: 5.5, km: 80}
    - {ab: 6.5, km: 200}
    - {ab: 7.5, km: 400}
  starkregen_ab_mm: 25        # In der Atacama ist das bereits ein Extremereignis (invierno boliviano)
  trocken_fenster_tage: 180
  trocken_unter: 0.6
  trocken_normal_ab_mm: 10
  gelb_tage: 30

fristen_gelb_ab_tage: 30
fristen:
  - kennung: corfo_sqm_2030
    name: "CORFO-Pachtvertrag mit SQM für den Salar de Atacama"
    nummer: null
    achsen: [lithium]
    bis: 2030-12-31
    stand: "Läuft Ende 2030 aus; abgelöst durch die Beteiligung von Codelco über Nova Andino Litio bis 2060."
    verlaengert_bis: 2060-12-31
  - kennung: corfo_albemarle_2043
    name: "CORFO-Quote für Albemarle"
    nummer: null
    achsen: [lithium]
    bis: 2043-12-31
    stand: "Option auf 240.000 Tonnen zusätzliche Quote seit Mai 2024."
    verlaengert_bis: null
  - kennung: salar_schutzgebiete
    name: "Schutzgebiete für zehn Salare und sechs Lagunen (Dekrete vom 29.01.2026)"
    nummer: null
    achsen: [lithium]
    bis: 2027-12-31
    stand: "Offener Risikofaktor: Nach dem Regierungswechsel im März 2026 wird eine Abschwächung befürchtet. Eine Rücknahme wäre eine Lockerung nach C4."
    verlaengert_bis: null

gegenseite:
  tage: 30
  begriffe:
    lithium: [lithium]
    "battery materials": [lithium]
    "critical mineral": []
  behoerden_suche: [industry-and-security-bureau, trade-representative-office-of-united-states, commerce-department,
                    international-trade-administration, executive-office-of-the-president]
  gewichtig:
    - {art: "Presidential Document"}
    - {behoerde: "industry-and-security-bureau"}
    - {behoerde: "trade-representative-office-of-united-states"}
    - {behoerde: "commerce-department", arten: ["Rule", "Proposed Rule"]}
    - {behoerde: "international-trade-administration", titel_enthaelt: ["Chile"], titel_nennt_achse: true}
  ausschluss_titel: ["Advisory Committee", "Meeting"]
  suchwoerter:
    lithium: [lithium, spodumene, "lithium carbonate", "lithium hydroxide"]

preisprobe:
  tage_kurz: 5
  tage_lang: 20
  gelaufen_ab: 0.15
  handel_tage: 60
  duenn_unter: 1000000

# Ereignisse für den Rückblick (Tag der Ankündigung). Recherchiert am 08.10.2026.
