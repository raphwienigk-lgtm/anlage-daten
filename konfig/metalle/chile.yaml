  - {datum: 2026-02-12, art: lockerung,     achsen: [lithium], text: "Codelcos Maricunga-Konzession verlängert, Explorationsphase plus vier Jahre"}

rueckblick:
  horizonte: [0, 5, 20, 60]
  vorlauf: 20
  haupt: 20
  treffer_ab: 0.10
  bestanden: {mindestens: 3, trefferquote: 0.5}
  kurse_ab: 2008-01-01
