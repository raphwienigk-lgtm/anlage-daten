# Prüflauf: sind alle Quellen erreichbar? Von Hand starten (Actions → Prüflauf → Run workflow).
name: Prüflauf

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-pruefen
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Prüflauf
        run: python -m anlage.pruefen
      - name: Ergebnis sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/quellen-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Prüflauf $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
