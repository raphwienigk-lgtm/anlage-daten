# Metall-Agenten: täglich um 23:17 UTC, nach Börsenschluss in New York (die Kurse des Tages
# gelten erst ab 18 Uhr Ortszeit als fest). Fristen, US-Bundesregister, Erdbeben, Regen, Kurse,
# Ereignis-Rückblick. Die ersten Läufe laden zusätzlich das Regen-Normal 1991–2020 für die
# Wasserkraft-Standorte (etwa zwanzig Minuten je Land, danach nur noch Sekunden).
#
# Seit 08.10.2026 laufen fünf Länder nacheinander in EINEM Job: getrennte Formulare und
# getrennte Statuszeilen, aber eine gemeinsame Rechenmaschine. Nacheinander statt parallel,
# weil alle in dieselbe Ablage schreiben und sich sonst beim Zurückschreiben in die Quere kämen.
# Jeder Schritt hat `continue-on-error`, damit ein Land das nächste nicht mitreißt; gesichert
# wird am Ende in jedem Fall.
name: Metall-Agenten

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-metall
  cancel-in-progress: false

jobs:
  metall:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Metall-Agent China
        continue-on-error: true
        run: python -m anlage.metall --land china --budget-minuten 20
      - name: Metall-Agent Indonesien
        continue-on-error: true
        run: python -m anlage.metall --land indonesien --budget-minuten 20
      - name: Metall-Agent Chile
        continue-on-error: true
        run: python -m anlage.metall --land chile --budget-minuten 15
      - name: Metall-Agent Marokko
        continue-on-error: true
        run: python -m anlage.metall --land marokko --budget-minuten 15
      - name: Metall-Agent Kongo
        continue-on-error: true
        run: python -m anlage.metall --land kongo --budget-minuten 15
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Metall China $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
