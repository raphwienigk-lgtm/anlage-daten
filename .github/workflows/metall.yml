# Metall-Agent China: täglich um 23:17 UTC, nach Börsenschluss in New York (die Kurse des Tages
# gelten erst ab 18 Uhr Ortszeit als fest). Fristen, US-Bundesregister, Erdbeben, Regen, Kurse,
# Ereignis-Rückblick. Die ersten Läufe laden zusätzlich das Regen-Normal 1991–2020 für die
# Wasserkraft-Standorte in Yunnan (etwa zwanzig Minuten, danach nur noch Sekunden).
name: Metall China

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-metall
  cancel-in-progress: false

jobs:
  metall:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Metall-Agent China
        run: python -m anlage.metall --land china --budget-minuten 25
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Metall China $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
