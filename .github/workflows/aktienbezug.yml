# Welche Aktie folgt dem Rohstoffpreis am engsten? Von Hand starten; nur Messwerte.
name: Aktienbezug

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-aktienbezug
  cancel-in-progress: false

jobs:
  aktienbezug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Aktienbezug
        run: python -m anlage.aktienbezug
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Aktienbezug $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
