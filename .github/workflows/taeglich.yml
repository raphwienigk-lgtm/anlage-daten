# Täglicher Lauf: holt die Daten, rechnet die Ampel, legt Stand und Vorlesetext ab.
# Startet seit dem 30.10.2026 direkt nach den Ersatz-Sensoren (Kette ab 23:23 UTC über die
# Inlandspreise), vorher fest um 02:30 UTC. Grund: GitHub startete geplante Läufe ab dem 23.10.
# vier bis sechseinhalb Stunden zu spät, am 22.10. gar nicht.
name: Täglicher Lauf

on:
  workflow_run:
    workflows: ["Ersatz-Sensoren"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-lauf
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Lauf
        run: python -m anlage.lauf
      - name: Ergebnis sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten abgabe
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Lauf $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
