# Ersatz-Sensoren: Haselnuss → Select Harvests (Spätfrost) und Palladium → Platin (Preis des Originals),
# täglich um 02:07 UTC (04:07 Uhr), vor dem Anlage-Bewerter. Außerhalb der Frostsaison dauert der Lauf
# Sekunden. Die ersten Haselnuss-Läufe laden einmalig die Frostsaisons ab 1991 (etwa eine Viertelstunde).
name: Ersatz-Sensoren

on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-ersatz
  cancel-in-progress: false

jobs:
  ersatz:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Ersatz-Sensoren
        run: python -m anlage.ersatz --kennung alle --budget-minuten 20
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Ersatz-Sensoren $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
