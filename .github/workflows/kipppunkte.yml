# Wächter 3 · Kipppunkt-Register: täglich um 15:23 UTC, nach der Klimatologie (Open-Meteo-Kontingent).
# Der Lauf endet nach Sekunden, solange der Bericht für das Quartal steht und alle Reihen da sind.
# Der erste Lauf eines Quartals schreibt den Bericht; fehlende Reihen werden an den Folgetagen ergänzt.
name: Kipppunkte

on:
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Bericht jetzt neu schreiben (ja/nein)"
        default: "nein"

permissions:
  contents: write

concurrency:
  group: anlage-kipppunkte
  cancel-in-progress: false

jobs:
  kipppunkte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt netCDF4
      - name: Kipppunkt-Register
        env:
          ERZWINGEN: ${{ inputs.erzwingen }}
        run: |
          if [ "$ERZWINGEN" = "ja" ]; then
            python -m anlage.kipppunkte --erzwingen --budget-minuten 40
          else
            python -m anlage.kipppunkte --budget-minuten 40
          fi
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Kipppunkte $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
