# Quellen-Sonde: holt von neuen Kandidaten-Quellen eine kleine Probe (Format, Maße, Auszug)
# und legt sie unter daten/sonde/ ab. Von Hand starten; rechnet nichts.
name: Quellen-Sonde

on:
  workflow_dispatch:
    inputs:
      nur:
        description: "Nur diese Proben (kommagetrennt, leer = alle)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: anlage-sonde
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt netCDF4
      - name: Sonde
        env:
          NUR: ${{ inputs.nur }}
        run: |
          if [ -n "$NUR" ]; then python -m anlage.sonde --nur "$NUR"; else python -m anlage.sonde; fi
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten/sonde
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Quellen-Sonde $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
