# Schattendepot: bereitet täglich um 03:07 UTC (05:07 Uhr) das Gesamt-Schattendepot vor, nach dem
# Tageslauf und den Ersatz-Sensoren: Devisenkurse ins Archiv, daten/depot/index.json mit allen Werten
# der Zweige, dazu eine Probe ohne die Metall-Positionen. Gerechnet wird beim Depot-Agenten in der Cloud
# (06:22 Uhr), der das Schattendepot des Metall-Wächters dazulegt. Reine Rechnung, kein echtes Geld.
name: Schattendepot

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anlage-depot
  cancel-in-progress: false

jobs:
  depot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete installieren
        run: pip install -r requirements.txt
      - name: Schattendepot vorbereiten
        run: python -m anlage.depot
      - name: Ergebnis sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A daten abgabe
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Schattendepot $(date -u +%Y-%m-%dT%H:%MZ)"
          for versuch in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((versuch * 10))
          done
          exit 1
